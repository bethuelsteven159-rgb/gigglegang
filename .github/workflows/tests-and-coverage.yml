name: Tests and Coverage

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean old coverage reports
        run: |
          rm -rf coverage
          rm -rf Backend/coverage
          rm -rf campusfood/coverage

      - name: Install dependencies
        run: |
          cd campusfood
          npm install

      - name: Run tests with coverage
        run: |
          cd campusfood
          npm run test:coverage

      - name: Check coverage file exists
        run: |
          test -f campusfood/coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: campusfood/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true