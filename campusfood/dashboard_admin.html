<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
    <title>Admin Dashboard | Campus Food</title>
  </head>
  <body>
    <nav class="navbar">
      <span class="brand">Campus Food — Admin</span>
      <div class="user-info">
        <span>🛡️ <span id="adminName"></span></span>
        <button onclick="logout()" type="button">Logout</button>
      </div>
    </nav>

    <main class="page">
      <section class="page-hero admin-hero">
        <div class="hero-content">
          <p class="eyebrow">Admin command centre</p>
          <h2>Welcome, <span id="adminNameWelcome"></span></h2>
          <p class="page-subtitle">
            Review vendors, monitor orders, inspect analytics, and keep food
            information compliant.
          </p>
        </div>
        <div class="hero-badge" aria-hidden="true">🛡️</div>
      </section>

      <section class="cards" aria-label="Admin actions">
        <a class="card" href="admin_vendor_control.html">
          <div class="icon">🏪</div>
          <div class="label">Vendor Control</div>
        </a>

        <a class="card" href="admin_orders.html">
          <div class="icon">📋</div>
          <div class="label">All Orders</div>
        </a>

        <a class="card" href="admin_analytics.html">
          <div class="icon">📊</div>
          <div class="label">Analytics</div>
        </a>

        <a class="card" href="admin_compliance.html">
          <div class="icon">✅</div>
          <div class="label">Compliance Report</div>
        </a>
      </section>
    </main>

    <div id="toast"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
