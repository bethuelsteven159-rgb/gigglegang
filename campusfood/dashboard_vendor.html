<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f97316" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
  <title>Vendor Dashboard | Campus Food</title>
</head>
<body>
  <nav class="navbar">
    <span class="brand">Campus Food — Vendor</span>
    <div class="user-info">
      <span>👤 <span id="vendorName"></span></span>
      <button onclick="logout()" type="button">Logout</button>
    </div>
  </nav>

  <main class="page">
    <section class="page-hero vendor-hero">
      <div class="hero-content">
        <p class="eyebrow">Vendor dashboard</p>
        <h2>Welcome, <span id="vendorNameWelcome"></span></h2>
        <p class="page-subtitle">
          Manage your menu, process incoming orders, and check how your food business is performing.
        </p>
      </div>
      <div class="hero-badge" aria-hidden="true">🍽️</div>
    </section>

    <section class="cards" aria-label="Vendor actions">
      <a class="card" href="vendor_menu.html">
        <div class="icon">🍽️</div>
        <div class="label">Manage Menu</div>
      </a>

      <a class="card" href="vendor_orders.html">
        <div class="icon">📦</div>
        <div class="label">My Orders</div>
      </a>

      <a class="card" href="vendor_analytics.html">
        <div class="icon">📊</div>
        <div class="label">Analytics</div>
      </a>

      <a class="card" href="vendor_profile.html">
        <div class="icon">🏪</div>
        <div class="label">Shop Profile</div>
      </a>
    </section>
  </main>

  <div id="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
