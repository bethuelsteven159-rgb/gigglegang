<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#f97316" />
  <link rel="stylesheet" href="style.css" />

  <title>Payment Cancelled | Campus Food</title>

<body>
  <nav class="navbar">
    <span class="brand">Payment</span>
  </nav>

  <main class="page payment-page">

      <div class="payment-icon warning" aria-hidden="true">!</div>
      <p class="eyebrow">Payment status</p>
      <h2>Payment Cancelled</h2>
      <p id="paymentCancelStatus">Cancelling your payment...</p>

      <div class="actions">
        <a href="dashboard_student.html" id="retryPaymentBtn" class="btn btn-primary" hidden>Back to cart</a>
        <a href="dashboard_student.html" id="dashboardBtn" class="btn" hidden>Go to dashboard</a>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script type="module" src="js/main.js"></script>
