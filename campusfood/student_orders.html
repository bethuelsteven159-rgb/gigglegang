<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f97316" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
  <title>Order Food | Campus Food</title>
</head>
<body>
  <nav class="navbar">
    <span class="brand">Order Food</span>

    <div class="user-info">
      <a href="dashboard_student.html" class="btn btn-sm">← Dashboard</a>
      <span>👤 <span id="studentName"></span></span>
      <button onclick="logout()" type="button">Logout</button>
    </div>
  </nav>

  <main class="page">
    <section class="page-hero order-hero">
      <div class="hero-content">
        <p class="eyebrow">Student ordering</p>

        <h2>Choose your next campus meal</h2>

        <p class="page-subtitle">
          Browse all menu items or pick a specific vendor. Keep one vendor per cart so the kitchen can move fast.
        </p>
      </div>

      <div class="hero-badge" aria-hidden="true">🛒</div>
    </section>

    <section class="panel toolbar-panel" aria-label="Browse controls">
      <div class="toolbar">
        <div class="toolbar-group">
          <button id="browseByMenuBtn" class="btn btn-primary" type="button">
            Browse by Menu
          </button>

          <button id="browseByVendorBtn" class="btn" type="button">
            Browse by Vendor
          </button>
        </div>
      </div>

      <div id="searchContainer" style="margin-top: 1rem; display: none;">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search menu items..."
        />
      </div>

      <div id="filterPanel" style="margin-top: 1rem; display: none;">
        <div class="filters compact-filters">
          <div class="filter-group">
            <label for="priceFilter">Price</label>

            <select id="priceFilter">
              <option value="">All prices</option>
              <option value="low-high">Low to High</option>
              <option value="high-low">High to Low</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="ratingFilter">Rating</label>

            <select id="ratingFilter">
              <option value="">All ratings</option>
              <option value="1">★ 1 star &amp; up</option>
              <option value="2">★★ 2 stars &amp; up</option>
              <option value="3">★★★ 3 stars &amp; up</option>
              <option value="4">★★★★ 4 stars &amp; up</option>
              <option value="5">★★★★★ 5 stars only</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="dietaryFilter">Dietary</label>

            <select id="dietaryFilter">
              <option value="">All Items</option>
              <option value="halal">Halal</option>
              <option value="vegan">Vegan</option>
              <option value="vegetarian">Vegetarian</option>
            </select>
          </div>
        </div>

        <div class="allergen-filter-section">
          <p class="filter-title">Avoid Allergens</p>

          <div class="allergen-filters">
            <label>
              <input type="checkbox" value="gluten" class="allergenFilter" />
              🌾 Gluten
            </label>

            <label>
              <input type="checkbox" value="shellfish" class="allergenFilter" />
              🦐 Shellfish
            </label>

            <label>
              <input type="checkbox" value="eggs" class="allergenFilter" />
              🥚 Eggs
            </label>

            <label>
              <input type="checkbox" value="peanuts" class="allergenFilter" />
              🥜 Peanuts
            </label>

            <label>
              <input type="checkbox" value="soy" class="allergenFilter" />
              🌱 Soy
            </label>

            <label>
              <input type="checkbox" value="dairy" class="allergenFilter" />
              🥛 Dairy
            </label>
          </div>
        </div>

        <button id="mostOrderedBtn" class="btn btn-primary btn-sm" type="button">
          🔥 Most Ordered
        </button>

        <button id="resetFiltersBtn" class="btn btn-sm" type="button">
          Reset Filters
        </button>
      </div>
    </section>

    <section id="menuView">
      <div class="section-title-row">
        <h2>Available Menu</h2>
      </div>

      <div id="menuContainer" class="menu-grid">
        <p class="top-vendors-empty">Loading menu…</p>
      </div>
    </section>

    <section id="vendorsView" style="display: none;">
      <div class="section-title-row">
        <h2>All Vendors</h2>
      </div>

      <div id="vendorsContainer" class="menu-grid">
        <p class="top-vendors-empty">Loading vendors…</p>
      </div>
    </section>
  </main>


  <!-- Vendor Profile Modal -->
  <div id="vendorProfileModal" hidden
    style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:14px;padding:2rem;width:90%;max-width:480px;box-shadow:0 12px 40px rgba(0,0,0,0.2);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 style="margin:0;font-size:1.2rem;" id="vpm-name"></h3>
        <button class="btn btn-sm" onclick="closeVendorProfile()"
          style="background:var(--surface-alt);border:1px solid var(--border);">✕ Close</button>
      </div>
      <p id="vpm-desc" style="color:var(--text-muted);font-size:0.9rem;margin:0 0 1rem;line-height:1.5;"></p>
      <div id="vpm-hours-row" style="display:flex;gap:0.5rem;align-items:flex-start;margin-bottom:0.75rem;">
        <span>🕐</span>
        <div>
          <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;">Opening Hours</div>
          <div id="vpm-hours" style="font-size:0.9rem;"></div>
        </div>
      </div>
      <div id="vpm-contact-row" style="display:flex;gap:0.5rem;align-items:flex-start;">
        <span>📞</span>
        <div>
          <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;">Contact</div>
          <div id="vpm-contact" style="font-size:0.9rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
